<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Sky & Atmosphere Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0a1224" />
      <stop offset="85%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#1c2d4a" />
    </linearGradient>

    <!-- Runway Gradient -->
    <linearGradient id="runwayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="100%" stop-color="#090d14" />
    </linearGradient>

    <!-- Jet Contrail Glow -->
    <linearGradient id="contrailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    @keyframes flightPath {
      0% {
        transform: translate(60px, 165px) rotate(-3deg) scale(0.65);
      }
      30% {
        transform: translate(240px, 140px) rotate(-9deg) scale(0.85);
      }
      65% {
        transform: translate(520px, 75px) rotate(-14deg) scale(1.05);
      }
      100% {
        transform: translate(840px, -20px) rotate(-15deg) scale(1.2);
      }
    }

    @keyframes beaconBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #ff0055); }
      50% { opacity: 0.1; }
    }

    @keyframes runwayLightPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }

    .plane-flight {
      animation: flightPath 9s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .star-1 { animation: starTwinkle 3s infinite ease-in-out; }
    .star-2 { animation: starTwinkle 2s infinite ease-in-out 1s; }
    .star-3 { animation: starTwinkle 4s infinite ease-in-out 0.5s; }
    .beacon { animation: beaconBlink 1.2s infinite; }
    .runway-light { animation: runwayLightPulse 2s infinite ease-in-out; }
  </style>

  <!-- Sky Canvas -->
  <rect width="800" height="240" rx="14" fill="url(#skyGrad)" />

  <!-- Stars in Twilight -->
  <circle cx="120" cy="40" r="1.5" fill="#ffffff" class="star-1" />
  <circle cx="210" cy="65" r="1" fill="#88c0d0" class="star-2" />
  <circle cx="340" cy="30" r="1.5" fill="#ffffff" class="star-3" />
  <circle cx="480" cy="55" r="1.2" fill="#e5e9f0" class="star-1" />
  <circle cx="610" cy="25" r="1" fill="#81a1c1" class="star-2" />
  <circle cx="730" cy="50" r="1.5" fill="#ffffff" class="star-3" />
  <circle cx="680" cy="90" r="1" fill="#88c0d0" class="star-1" />
  <circle cx="80" cy="85" r="1.2" fill="#ffffff" class="star-2" />

  <!-- Runway Ground Surface (Perspective Trapezoid) -->
  <polygon points="120,240 680,240 470,185 330,185" fill="url(#runwayGrad)" />
  <line x1="330" y1="185" x2="470" y2="185" stroke="#25354d" stroke-width="1.5" />

  <!-- Runway Centerline Dashes (Perspective) -->
  <line x1="400" y1="236" x2="400" y2="225" stroke="#ffffff" stroke-width="3" opacity="0.8" />
  <line x1="400" y1="218" x2="400" y2="210" stroke="#ffffff" stroke-width="2.5" opacity="0.7" />
  <line x1="400" y1="205" x2="400" y2="199" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="400" y1="195" x2="400" y2="190" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
  <line x1="400" y1="188" x2="400" y2="185" stroke="#ffffff" stroke-width="1" opacity="0.4" />

  <!-- Runway Edge Lights (Amber / Cyan) -->
  <circle cx="150" cy="235" r="2.5" fill="#ffb703" class="runway-light" filter="url(#softGlow)" />
  <circle cx="210" cy="220" r="2" fill="#ffb703" class="runway-light" />
  <circle cx="265" cy="207" r="1.8" fill="#ffb703" class="runway-light" />
  <circle cx="315" cy="195" r="1.5" fill="#00f0ff" class="runway-light" />
  <circle cx="330" cy="186" r="1.2" fill="#00f0ff" class="runway-light" />

  <circle cx="650" cy="235" r="2.5" fill="#ffb703" class="runway-light" filter="url(#softGlow)" />
  <circle cx="590" cy="220" r="2" fill="#ffb703" class="runway-light" />
  <circle cx="535" cy="207" r="1.8" fill="#ffb703" class="runway-light" />
  <circle cx="485" cy="195" r="1.5" fill="#00f0ff" class="runway-light" />
  <circle cx="470" cy="186" r="1.2" fill="#00f0ff" class="runway-light" />

  <!-- Subtle Horizon Glow -->
  <ellipse cx="400" cy="185" rx="300" ry="12" fill="#00f0ff" opacity="0.08" />

  <!-- Airport Identifier Badge & Callout (Ngurah Rai - DPS) -->
  <rect x="25" y="16" width="165" height="26" rx="5" fill="#070c18" stroke="#1c2d4a" stroke-width="1" />
  <circle cx="38" cy="29" r="4" fill="#00ff66" />
  <text x="48" y="33" fill="#88c0d0" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="1">DPS // RWY 09-27</text>

  <rect x="635" y="16" width="140" height="26" rx="5" fill="#070c18" stroke="#1c2d4a" stroke-width="1" />
  <text x="705" y="33" fill="#ffb703" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">DEPARTURES ✈️</text>

  <!-- Animated Plane & Jet Contrail -->
  <g class="plane-flight">
    <!-- Glowing Contrail / Exhaust Trail -->
    <path d="M-90,3 L-12,0" stroke="url(#contrailGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M-80,8 L-14,3" stroke="url(#contrailGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Jet Fuselage (Streamlined Airliner) -->
    <path d="M42,0 C38,-4 20,-5 -5,-5 C-25,-5 -45,-3 -55,0 C-45,3 -25,5 -5,5 C20,5 38,4 42,0 Z" fill="#e5e9f0" />
    
    <!-- Cockpit Windshield -->
    <path d="M34,-1 C30,-3 26,-3 24,-1 L25,1 C28,1 32,1 34,-1 Z" fill="#1b2a40" />

    <!-- Main Wing (Swept-back) -->
    <polygon points="5,-2 -18,-24 -26,-23 -9,-2" fill="#d8dee9" />
    <polygon points="2,2 -16,22 -24,21 -8,2" fill="#c4cddb" />
    <!-- Winglet Glow -->
    <circle cx="-18" cy="-24" r="1.5" fill="#00f0ff" filter="url(#softGlow)" />
    <circle cx="-16" cy="22" r="1.5" fill="#00ff66" filter="url(#softGlow)" />

    <!-- Tail Fin (Vertical Stabilizer) -->
    <polygon points="-38,-4 -52,-20 -58,-19 -48,-3" fill="#00f0ff" />
    
    <!-- Tail Beacon Light (Blinking Red) -->
    <circle class="beacon" cx="-52" cy="-20" r="2.2" fill="#ff0055" />

    <!-- Jet Engine Pods -->
    <rect x="-8" y="-10" width="14" height="5" rx="2.5" fill="#8892b0" />
    <rect x="-8" y="5" width="14" height="5" rx="2.5" fill="#8892b0" />
  </g>
</svg>
